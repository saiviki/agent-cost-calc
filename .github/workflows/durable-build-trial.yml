# .github/workflows/durable-build-trial.yml — build-service trial on GitHub-hosted runner
# Trial job that exercises the mission-control durable build on the
# automation/build-service-trial branch. Debug artifact is uploaded always.

name: Durable Build Trial

on:
  push:
    branches: [automation/build-service-trial]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: mc-build-trial
  cancel-in-progress: false

jobs:
  trial:
    name: Build-service trial
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout agent-cost-calc
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check trial credentials and repository access
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
        run: |
          test -n "$GH_TOKEN" || { echo 'PAT_TOKEN is missing'; exit 1; }
          test -n "$Z_AI_API_KEY" || { echo 'Z_AI_API_KEY is missing'; exit 1; }
          gh api user --silent
          gh api repos/saiviki/mission-control --jq '.permissions | {pull, push}'
          gh api repos/saiviki/agent-cost-calc --jq '.permissions | {pull, push}'

      - name: Checkout mission-control
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: saiviki/mission-control
          ref: c2f7224c1ce17e621ece4a2963280f1373f1bd0e # feat/durable-execution, reviewed trial service
          token: ${{ secrets.PAT_TOKEN }}
          path: mission-control
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.5

      - name: Install OpenCode
        run: npm install --global opencode-ai@1.18.30

      - name: Install mission-control dependencies
        working-directory: mission-control
        run: bun install --frozen-lockfile

      - name: Verify build service on Linux
        working-directory: mission-control
        run: |
          bunx tsc -p tsconfig.build-service.json
          bun test src/build-service src/cli/commands/builds.test.ts

      - name: Run hosted build trial
        working-directory: mission-control
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}
          Z_AI_API_KEY: ${{ secrets.Z_AI_API_KEY }}
        run: bun scripts/hosted-build-trial.ts

      - name: Upload trial artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mission-control-trial
          path: |
            mission-control/.mission-control/**
            !mission-control/.mission-control/**/auth-home/**
          include-hidden-files: true
          retention-days: 3
          if-no-files-found: ignore

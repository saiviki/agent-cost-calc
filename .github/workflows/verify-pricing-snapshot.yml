# Offline validation of the committed curated snapshot.
# Does not call models.dev. Unrelated PRs must not fail because upstream prices moved.

name: Verify pricing snapshot

on:
  push:
    branches: [main]
    paths:
      - "src/lib/pricing.generated.json"
      - "scripts/sync-models.ts"
      - "scripts/model-catalog.ts"
      - "scripts/models-dev-mappers.ts"
      - "scripts/validate-pricing-snapshot.ts"
      - "src/lib/models.ts"
      - ".github/workflows/verify-pricing-snapshot.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/lib/pricing.generated.json"
      - "scripts/sync-models.ts"
      - "scripts/model-catalog.ts"
      - "scripts/models-dev-mappers.ts"
      - "scripts/validate-pricing-snapshot.ts"
      - "src/lib/models.ts"
      - ".github/workflows/verify-pricing-snapshot.yml"
  workflow_dispatch:

concurrency:
  group: pricing-snapshot-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: pricing.generated.json offline validation
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Validate committed snapshot
        run: npm run sync-models:check
